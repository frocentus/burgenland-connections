<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personennetzwerk burgenland.ORF.at</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b24; --panel-2:#1b2430; --line:#26303d;
    --text:#e6edf3; --muted:#8b98a5; --accent:#4da3ff; --warn:#ffb454;
    --spo:#ff4d5a; --oevp:#3fd0c9; --fpo:#4d8dff; --gruene:#7ed957; --neos:#ff6ec7;
    --other:#9aa7b4;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 700px at 70% -10%, #1a2431 0%, var(--bg) 55%);
    color:var(--text);
    font:14px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .app{display:grid;grid-template-columns:290px 1fr 360px;grid-template-rows:auto 1fr;height:100vh}
  header{grid-column:1/4;display:flex;align-items:center;gap:18px;padding:12px 18px;
    border-bottom:1px solid var(--line);background:rgba(13,17,23,.85);backdrop-filter:blur(6px);z-index:5}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header h1 span{color:var(--muted);font-weight:400}
  .stats{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
  .stats b{color:var(--text);font-weight:600}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow-y:auto}
  aside.right{border-right:none;border-left:1px solid var(--line);width:360px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
  input[type=search],input[type=text],select{
    width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-size:13px;outline:none}
  input[type=search]:focus,select:focus{border-color:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .results{display:none;margin-top:6px;max-height:290px;overflow-y:auto;border-radius:8px;
    border:1px solid var(--line);background:var(--panel-2)}
  .results.open{display:block}
  .results .hit{display:flex;align-items:center;gap:8px;padding:6px 9px;cursor:pointer;font-size:13px}
  .results .hit:hover,.results .hit.active{background:#22303f}
  .results .hit i{width:9px;height:9px;border-radius:50%;flex:none}
  .results .hit .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .results .hit .mt{color:var(--muted);font-size:11.5px;flex:none}
  .results .none{padding:8px 10px;color:var(--muted);font-size:12.5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel-2);font-size:12px;cursor:pointer;user-select:none;opacity:.55}
  .chip.on{opacity:1;border-color:#3d5876}
  .chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.4}
  .list{max-height:calc(100vh - 420px);overflow-y:auto;margin-top:6px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
  .row:hover{background:var(--panel-2)}
  .row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .c{color:var(--muted);font-size:12px;flex:none}
  #canvasWrap{position:relative;overflow:hidden;background:
    radial-gradient(900px 500px at 50% 40%, rgba(77,163,255,.06), transparent 70%)}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}
  #graph{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #graph.dragging{cursor:grabbing}
  #graph text{font-family:"Segoe UI",Roboto,sans-serif;pointer-events:none;user-select:none}
  #graph .node{cursor:pointer}
  #graph .link{stroke-linecap:round}
  .toolbar{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
  button{background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  .legend{position:absolute;right:14px;bottom:14px;background:rgba(21,27,36,.85);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:11.5px;color:var(--muted)}
  .legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
  .legend i{width:9px;height:9px;border-radius:50%}
  .detail h2{font-size:17px;margin:2px 0 4px}
  .detail .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;
    background:var(--panel-2);border:1px solid var(--line);margin:0 6px 6px 0}
  .detail h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:16px 0 7px;border-top:1px solid var(--line);padding-top:10px}
  .article{display:block;padding:6px 0;border-bottom:1px dashed #202a36;text-decoration:none;color:var(--text)}
  .article:hover{color:var(--accent)}
  .article small{display:block;color:var(--muted);font-size:11.5px}
  blockquote{margin:6px 0;padding:7px 10px;background:var(--panel-2);border-left:2px solid var(--accent);
    border-radius:0 6px 6px 0;font-size:12.5px;color:#cfd8e3}
  .empty{color:var(--muted);font-size:13px;padding:20px 4px}
  .loading{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:rgba(13,17,23,.96);color:#cfd8e3;font-size:14px}
  .loading.on{display:flex}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid #26303d;border-top-color:#4da3ff;
    animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tooltip{position:absolute;pointer-events:none;background:#0b1118;border:1px solid var(--line);
    border-radius:7px;padding:6px 9px;font-size:12px;max-width:280px;opacity:0;transition:opacity .12s;z-index:10}
  .tooltip.on{opacity:1}
  .toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);cursor:pointer}
  @media (max-width:1100px){
    .app{grid-template-columns:250px 1fr}
    aside.right{display:none}
    .app.show-detail aside.right{display:block;position:absolute;right:0;top:57px;bottom:0;z-index:6}
  }
</style>
</head>
<body>
<div id="loading" class="loading"><div class="spinner"></div><div>Netzwerk wird aufgebaut …</div></div>
<div class="app">
  <header>
    <h1>Personennetzwerk <span>burgenland.ORF.at</span></h1>
    <div class="stats" id="stats"></div>
  </header>

  <aside class="left">
    <div class="field">
      <label for="search">Person suchen</label>
      <input type="search" id="search" placeholder="Name eingeben …" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="searchResults"
             aria-autocomplete="list">
      <div class="results" id="searchResults" role="listbox" aria-label="Suchergebnisse"></div>
      <div class="hint" id="searchHint"></div>
    </div>

    <div class="field">
      <label>Parteien</label>
      <div class="chips" id="partyChips"></div>
    </div>

    <div class="field">
      <label for="colorMode">Färbung</label>
      <select id="colorMode">
        <option value="party" selected>nach Partei</option>
        <option value="community">nach Netzwerk-Cluster</option>
      </select>
    </div>

    <div class="field">
      <label>Zeitraum: <b id="yearLabel">–</b></label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="range" id="yearFrom" min="2019" max="2026" step="1" value="2019">
        <input type="range" id="yearTo" min="2019" max="2026" step="1" value="2026">
      </div>
      <div class="hint">von / bis – filtert Personen und Beziehungen nach Jahr</div>
    </div>

    <div class="field">
      <label for="weight">Mindestzahl gemeinsamer Artikel: <b id="weightVal">1</b></label>
      <input type="range" id="weight" min="1" max="3" value="1" step="1">
    </div>

    <div class="field">
      <label for="sentiFilter">Beziehungen</label>
      <select id="sentiFilter">
        <option value="all" selected>alle</option>
        <option value="labelled">nur bewertete</option>
        <option value="conflict">nur konfliktär</option>
        <option value="positive">nur freundlich</option>
      </select>
    </div>

    <div class="field">
      <label for="toneFilter">Tonlage der Person</label>
      <select id="toneFilter">
        <option value="all" selected>alle</option>
        <option value="critical">kritisch geprägt</option>
        <option value="positive">zustimmend geprägt</option>
      </select>
    </div>

    <div class="field">
      <label for="minArticles">Personen ab … Artikeln</label>
      <select id="minArticles">
        <option value="solid" selected>belastbar (≥2 Artikel oder Funktion/Partei)</option>
        <option value="1">1 (alle)</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="8">8</option>
      </select>
    </div>

    <div class="field">
      <label class="toggle"><input type="checkbox" id="labels" checked> Namen einblenden</label>
      <label class="toggle" style="margin-top:7px"><input type="checkbox" id="isolated"> Auch Personen ohne Beziehung</label>
      <label class="toggle" style="margin-top:7px"><input type="checkbox" id="evidenceOnly" checked> Nur Beziehungen mit gemeinsamem Satz</label>
    </div>

    <div class="field">
      <label>Personen <span id="listCount" class="hint"></span></label>
      <div class="list" id="personList"></div>
    </div>
  </aside>

  <div id="canvasWrap">
    <svg id="graph"></svg>
    <div class="toolbar">
      <button id="btnCenter">Ansicht zentrieren</button>
      <button id="btnPng">Als PNG speichern</button>
      <button id="btnJson">JSON herunterladen</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <aside class="right detail" id="detail">
    <div class="empty">
      <h2 style="font-size:15px;color:var(--text)">Person auswählen</h2>
      Klicken Sie auf einen Knoten oder eine Kante, um Funktion, Parteizugehörigkeit,
      Artikel und die gemeinsamen Nennungen zu sehen.
    </div>
  </aside>
</div>

<script src="d3.v7.min.js"></script>
<script src="app.js"></script>
</body>
</html>
