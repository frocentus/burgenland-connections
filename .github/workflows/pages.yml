name: CI und GitHub Pages

# Crawling passiert bewusst NICHT hier, sondern lokal (voller Umfang).
# Dieser Workflow prüft den Code und veröffentlicht das zuletzt lokal
# erzeugte Ergebnis aus dem Release "data".

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Unit-Tests
        run: python -m unittest discover -s tests -v
      - name: Syntaxprüfung
        run: python -m compileall -q bglbot run.py publish.py

  deploy:
    name: Veröffentlichen
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Datenstand aus dem Release laden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release download data --pattern site.zip --dir . --clobber; then
            echo "::error::Kein Release 'data' mit site.zip gefunden."
            echo "Lokal ausführen: python run.py && python publish.py"
            exit 1
          fi
          unzip -o site.zip -d site
          test -s site/index.html || (echo "index.html fehlt im Archiv" && exit 1)
          ls -la site

      - name: Seiteninhalt prüfen
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("site/graph.json").read_text(encoding="utf-8"))
          meta = data["meta"]
          wiki = sum(1 for n in data["nodes"] if n.get("wikipedia"))
          print(f"Artikel: {meta['articles_crawled']} | Personen: {meta['persons']} | "
                f"Beziehungen: {meta['edges']} | Wikipedia: {wiki} | Stand: {meta['generated']}")
          PY

      - name: Pages-Artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
