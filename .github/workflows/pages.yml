name: CI und GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Täglich 05:00 UTC – hält die veröffentlichte Grafik aktuell
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Unit-Tests
        run: python -m unittest discover -s tests -v
      - name: Syntaxprüfung
        run: python -m compileall -q bglbot run.py

  build:
    name: Scrape und Seite bauen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: python -m pip install --upgrade pip -r requirements.txt

      # HTTP-Cache: macht Folgeläufe deutlich schneller und schont den ORF
      - name: Cache der abgerufenen Seiten
        uses: actions/cache@v4
        with:
          path: data/cache
          key: bgl-cache-${{ github.run_id }}
          restore-keys: bgl-cache-

      # Wikipedia-Antworten: einmal geholt, danach nur Ergänzungen
      - name: Cache der Wikipedia-Zusammenfassungen
        uses: actions/cache@v4
        with:
          path: data/wiki.json
          key: bgl-wiki-${{ github.run_id }}
          restore-keys: bgl-wiki-

      - name: Crawlen und auswerten
        run: |
          python run.py --pages 30 --wayback 600

      - name: Seitengrundlage prüfen
        run: |
          test -s data/out/graph.html || (echo "graph.html fehlt" && exit 1)
          mkdir -p site
          cp data/out/graph.html site/index.html
          cp data/out/graph.json site/graph.json 2>/dev/null || true
          cp data/out/personen.csv site/ 2>/dev/null || true
          cp data/out/beziehungen.csv site/ 2>/dev/null || true
          cp data/out/netzwerk.png site/ 2>/dev/null || true
          ls -la site

      - name: Statistik ausgeben
        run: |
          python - <<'PY'
          import json
          meta = json.load(open("data/out/graph.json", encoding="utf-8"))["meta"]
          print(f"Artikel: {meta['articles_crawled']}, Personen: {meta['persons']}, "
                f"Beziehungen: {meta['edges']}, Wikipedia: "
                f"{sum(1 for n in json.load(open('data/out/graph.json', encoding='utf-8'))['nodes'] if n.get('wikipedia'))}")
          PY

      - name: Pages-Artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
